# 🐍 Snake Contribution Animation
# This workflow generates a snake animation from your GitHub contribution graph.
# It runs daily and pushes the generated SVGs to the 'output' branch.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering from Actions tab

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E72020&color_dots=#ebedf0,#4F6793,#223057,#9A1316,#E72020
            dist/github-snake-dark.svg?color_snake=#ffffff&color_dots=#0d1117,#223057,#4F6793,#9A1316,#E72020

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
